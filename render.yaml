services:
  - type: worker
    name: coupon2025-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: BAKONG_TOKEN
        sync: false
      - key: NEON_DATABASE_URL
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
    autoDeploy: false
